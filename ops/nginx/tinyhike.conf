# TinyHike — nginx site config (Option A: native + systemd + nginx)
# TLS: Cloudflare Origin certificate (DNS is proxied 🟠, SSL mode Full-strict).
#
# Install:
#   sudo apt-get install -y nginx
#   # place the Cloudflare Origin cert + key (see DEPLOY.md) at:
#   #   /etc/ssl/cloudflare/tinyhike.pem   (certificate)
#   #   /etc/ssl/cloudflare/tinyhike.key   (private key, chmod 600)
#   sudo cp ops/nginx/tinyhike.conf /etc/nginx/sites-available/tinyhike
#   sudo ln -sf /etc/nginx/sites-available/tinyhike /etc/nginx/sites-enabled/tinyhike
#   sudo rm -f /etc/nginx/sites-enabled/default
#   # Cloudflare edge ranges (regenerate with ops/scripts/update-cloudflare-ips.sh):
#   sudo cp ops/nginx/cloudflare-*.conf /etc/nginx/snippets/
#   sudo nginx -t && sudo systemctl reload nginx

# Defines $cf_edge (1 when the TCP peer is a Cloudflare edge). http context, so it
# lives here at the top of the file, outside every server block.
include snippets/cloudflare-geo.conf;

# ── app.tinyhike.com — the PWA (static build) + same-origin /api proxy ──────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.tinyhike.com;

    ssl_certificate     /etc/ssl/cloudflare/tinyhike.pem;
    ssl_certificate_key /etc/ssl/cloudflare/tinyhike.key;

    # Makes $remote_addr the real visitor IP instead of the Cloudflare edge's.
    # Access logs, X-Forwarded-For and the API's per-IP rate limiting all depend on it.
    include snippets/cloudflare-realip.conf;

    # Refuse anything that didn't come through Cloudflare, so the WAF and the
    # DDoS protection can't be skipped by hitting the VPS IP directly.
    if ($cf_edge = 0) { return 403; }

    root /srv/tinyhike/web/dist;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets
    location ~* \.(js|css|png|ico|woff2|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin API proxy (so the web app can call /api/* without CORS).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: realip has already resolved it
        # to the true visitor IP, and appending to a client-supplied chain would let
        # anyone prepend a fake IP and dodge the API's per-IP rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── api.tinyhike.com — the API on its own subdomain ────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.tinyhike.com;

    ssl_certificate     /etc/ssl/cloudflare/tinyhike.pem;
    ssl_certificate_key /etc/ssl/cloudflare/tinyhike.key;

    include snippets/cloudflare-realip.conf;
    if ($cf_edge = 0) { return 403; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, not $proxy_add_x_forwarded_for: realip has already resolved it
        # to the true visitor IP, and appending to a client-supplied chain would let
        # anyone prepend a fake IP and dodge the API's per-IP rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── Plain HTTP → HTTPS (Cloudflare also does this, belt-and-suspenders) ─────────
server {
    listen 80;
    listen [::]:80;
    server_name app.tinyhike.com api.tinyhike.com;
    return 301 https://$host$request_uri;
}
